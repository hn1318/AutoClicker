name: release

# Push a tag such as `v1.0.2` to build the Windows installers and attach them to
# a GitHub Release. The app itself reads the same release feed for updates, so
# the tag body ends up as the "what's new" text shown to users.
#
# Build time is dominated by compiling ~400 crates in the release profile
# (LTO + codegen-units=1). Two things keep that off the critical path:
#   1. `ci.yml` warms the rust-cache on `master`; tag runs restore it.
#   2. The NSIS/WiX toolchains Tauri downloads are cached below.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the bundled version would make the in-app
      # update check offer a "new" version that is actually the same build.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($config.version -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $($config.version). Bump the version (and package.json) before tagging."
            exit 1
          }

      # Pin the major so CI and local stay compatible without hard-pinning an
      # exact patch (lockfiles are v9 either way).
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the default-branch cache warmed by ci.yml. `cache-on-failure`
      # keeps partial artifacts when a run dies mid-build.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Tauri downloads NSIS and WiX on first bundle; they rarely change.
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            tauri-tools-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # No separate type-check step: `pnpm build` (beforeBuildCommand) already
      # runs `vue-tsc --noEmit && vite build`, and it fails before cargo starts.

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle and the latest.json manifest. Without the
          # secret the build fails instead of shipping an unverifiable update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Manual runs (no tag) fall back to the version in tauri.conf.json.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: "AutoClicker ${{ github.ref_name }}"
          releaseBody: |
            Windows 安装包见下方 Assets（`.msi` 安装版 / `-setup.exe` 便携安装版）。

            Windows installers are attached below.
          # Manual runs are drafts so they cannot ship a half-checked build.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          # Fail loudly instead of silently skipping the upload.
          args: --bundles nsis,msi
